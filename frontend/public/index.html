<!doctype html>
<html>
	<head>
		<meta http-equiv="Content-type" content="text/html; charset=utf-8" />
		<title>310 Frontend</title>
		<link href="/style.css" rel="stylesheet" />
	</head>
	<style>
		table {
			border-spacing: 0;
			width: 100%;
			border: 1px solid #ddd;
		}

		th, td {
			text-align: left;
			padding: 16px;
		}

		tr:nth-child(even) {
			background-color: #f2f2f2
		}
	</style>
	<body>
	<table id="myTable">
		<tr>
			<!--When a header is clicked, run the sortTable function, with a parameter, 0 for sorting by names, 1 for sorting by country:-->
			<th onclick="sortByAttribute('dept')">Dept</th>
			<th onclick="sortByAttribute('code')">Code</th>
			<th onclick="sortByAttribute('title')">Title</th>
			<th onclick="sortByAttribute('year')">Year</th>
			<th onclick="sortByAttribute('instructor')">Instructor</th>
			<th onclick="sortByAttribute('avg')">Avg</th>
		</tr>
	</table>
	<button onclick = "openInstructorModal()">Advanced Search</button>
	<!-- Start of AI Code -->
	<div id="instructorModal" style="display:none; position:fixed; z-index:1; left:0; top:0; width:100%; height:100%; background-color: rgba(0,0,0,0.5);">
		<div style="background-color:white; margin:15% auto; padding:20px; width:300px; border-radius:8px;">
			<label for="instructorInput">Filter by Instructor</label>
			<p>Use * for wildcards (e.g., *Kiczales*)</p>
			<input type="text" id="instructorInput" placeholder="Enter instructor name...">
			<br><br>
			<button onclick="applyInstructorFilter()">Apply Filter</button>
			<button onclick="closeModal()">Cancel</button>
			<div id="filterSection">
				<label for="deptSelect">Filter by Departments (Hold Ctrl/Cmd to select multiple):</label><br>
				<select id="deptSelect" multiple size="5" style="width: 200px;">
				</select>
				<br>
				<button onclick="applyMultiDeptFilter()">Apply Filter</button>
			</div>
		</div>
	</div>

	<!-- End of AI Code -->
	<script type="text/javascript" src="/frontend.js"></script>
	</body>
</html>
